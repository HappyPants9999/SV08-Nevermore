##MyMacros##

# My_Macros.cfg — client-variable hookup for mainsail.cfg's PAUSE/RESUME/CANCEL_PRINT,
# pointed at Demon's pause/resume/cancel handlers.
#
# This is the _CLIENT_VARIABLE block copied out of mainsail-config's mainsail.cfg
# (the file your [include mainsail.cfg] pulls in, kept up to date by Moonraker's
# update_manager per your moonraker.conf), uncommented, with values filled in.
# Adjust the park position and retract/speed numbers to taste — nothing here is
# Demon-specific except the three variable_user_*_macro lines and use_fw_retract.

[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True    ; use custom park coordinates for x,y
variable_custom_park_x    : 10.0    ; your X travel is 0-355 - keep this off the limits
variable_custom_park_y    : 354.0   ; your Y travel is 0-364 - keep this off the limits
variable_custom_park_dz   : 10.0    ; z-hop in mm when parking for pause/cancel
variable_retract          : 1.0     ; retract (mm) on PAUSE
variable_cancel_retract   : 5.0     ; retract (mm) on CANCEL_PRINT
variable_speed_retract    : 35.0    ; retract speed mm/s
variable_unretract        : 1.0     ; unretract (mm) on RESUME
variable_speed_unretract  : 35.0    ; unretract speed mm/s
variable_speed_hop        : 15.0    ; z move speed mm/s
variable_speed_move       : 100.0   ; xy move speed mm/s
variable_park_at_cancel   : False   ; DEMON: leave False - Demon's own cancel handling covers this
variable_park_at_cancel_x : None
variable_park_at_cancel_y : None
# [firmware_retraction] must exist in printer.cfg for this - it does, it's already there
variable_use_fw_retract   : True
variable_idle_timeout     : 600     ; mid-print idle timeout (sec) - separate from printer.cfg's [idle_timeout]
variable_runout_sensor    : "filament_switch_sensor filament_sensor"
# DEMON: hand pause/resume/cancel over to Demon's macros
variable_user_pause_macro : "_DEMON_PAUSE"
variable_user_resume_macro: "_DEMON_RESUME"
variable_user_cancel_macro: "_DEMON_CANCEL"
gcode:
